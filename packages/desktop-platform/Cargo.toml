[package]
name = "prism-desktop-platform"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native Windows and Linux adapters for Prism"

[dependencies]
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "windows")'.dependencies]
dunce = "1"
windows = { version = "0.61", features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_System_Variant", "Win32_System_Com_StructuredStorage"] }
keyring = { version = "3.6.3", features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_Power", "Win32_System_Shutdown", "Win32_System_Threading", "Win32_System_DataExchange", "Win32_Security"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["async-secret-service", "tokio", "crypto-rust"] }
x11rb = { version = "0.13.2", features = ["randr", "xtest", "dpms"] }
zbus = "5.13.2"
