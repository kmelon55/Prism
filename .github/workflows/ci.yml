name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The signing integration test needs the local signing identity, so it runs only on the signing Mac.
      - run: node --test scripts/macos-signing.test.mjs scripts/verify-updater.test.mjs scripts/sign-updater.test.mjs scripts/native-release-feed.test.mjs scripts/android-release.test.mjs
      - run: swift build
        working-directory: apps/mac
      - run: swift test
        working-directory: apps/mac
