name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    # Releases are built with Xcode 27 (Swift 6.4); Xcode 26 rejects or crashes on parts of this package.
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The signing integration test needs the local signing identity, so it runs only on the signing Mac.
      - run: node --test scripts/macos-signing.test.mjs scripts/verify-updater.test.mjs scripts/sign-updater.test.mjs scripts/native-release-feed.test.mjs scripts/android-release.test.mjs
      - run: swift build
        working-directory: apps/mac
      - run: swift test
        working-directory: apps/mac
